[project]
name = "mcp-guard"
version = "0.2.1"
description = "Adversarial fuzzer for MCP servers — send real payloads and classify the responses"
requires-python = ">=3.11"
dependencies = []
license = { text = "MIT" }
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
