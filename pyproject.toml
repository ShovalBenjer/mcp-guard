[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.2.1"
description = "MCP Server Security Scanner — audit MCP endpoints against OWASP Agentic Top 10"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# ruff and mypy are pinned exactly (not floated): both gates assert on the
# tool's *opinion* (format layout, strict diagnostics), which drifts between
# releases — a floating ruff/mypy makes the gate non-hermetic. The other dev
# tools (bandit findings, pip-audit DB) are rule/data-driven and stay floated.
dev = ["pytest>=8.0", "pytest-cov>=4.0", "pyyaml>=6.0", "bandit>=1.7", "pip-audit>=2.7", "cyclonedx-bom>=7.0", "ruff==0.16.10", "mypy==2.4.0"]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
