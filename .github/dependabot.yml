version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    open-pull-requests-limit: 5
    pr-branch-suffix: "ci-deps"
    auto-merge:
      - match:
          dependency-type: "development"
          update-type: "version-update:semver-patch"
        commit-message:
          prefix: "ci(deps)"
          include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    groups:
      pip:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    open-pull-requests-limit: 5
    pr-branch-suffix: "pip-deps"
    auto-merge:
      - match:
          dependency-type: "development"
          update-type: "version-update:semver-patch"
        commit-message:
          prefix: "ci(deps)"
          include: "scope"

