name: CI
# mcp-guard#27: mature CI — matrix testing, coverage, strict typing,
# security gates (bandit + pip-audit), CycloneDX SBOM, fuzz gate,
# and the leaderboard-methodology benchmark gate.
on: [push, pull_request]

jobs:
  test:
    name: test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src/mcp_guard --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      - name: Lint
        run: ruff check src/ tests/
      - name: Format check
        run: ruff format --check src/ tests/
      - name: Type check (strict)
        run: mypy --strict src/mcp_guard

  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Bandit security scan
        run: |
          bandit -r src/mcp_guard/ -f json -o bandit-report.json
          bandit -r src/mcp_guard/
      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
      - name: pip-audit dependency audit
        run: pip-audit --desc

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --of JSON -o sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  fuzz-gate:
    name: fuzz gate (spec premortem failure modes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Run fuzzer battery
        run: pytest tests/test_fuzzer.py tests/test_indirect_injection.py tests/test_false_positive_factory.py -v --tb=short

  benchmark-gate:
    name: benchmark gate (leaderboard methodology)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system
      - name: Reproduce leaderboard methodology (enumerate, fuzz, classify)
        run: pytest tests/test_leaderboard_methodology.py -v --tb=short
