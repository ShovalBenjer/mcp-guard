name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short --cov=mcp_guard --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          name: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    name: Type Check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy strict
        run: mypy --strict src/mcp_guard

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install security tools
        run: |
          pip install bandit[toml] pip-audit
      - name: Bandit security scan
        run: bandit -r src/mcp_guard -ll
      - name: pip-audit dependency audit
        run: pip-audit

  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom
      - name: Generate CycloneDX SBOM
        run: |
          cyclonedx-py environment --output-file sbom.json --format json
          cyclonedx-py environment --output-file sbom.xml --format xml
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.json
            sbom.xml
          retention-days: 30

  fuzz:
    name: Fuzz Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run fuzz test suite
        run: pytest tests/fuzz_test.py -v --tb=short

  benchmark:
    name: Benchmark Gate (Leaderboard Methodology)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify benchmark methodology compliance
        run: |
          python -c "
          from mcp_guard.fuzzer import FuzzEngine, FuzzReport, ResultCategory
          from mcp_guard.transport import StdioTransport
          from mcp_guard.payloads import generate_all_for_param

          # Test 1: Enumeration works
          # Test 2: Schema-aware payloads generated
          payloads = generate_all_for_param('url', {'type': 'string', 'format': 'uri'})
          assert any(p.rule_id == 'ssrf' for p in payloads), 'SSRF payloads missing for URI param'

          # Test 3: Classification logic
          from mcp_guard.fuzzer import FuzzResult
          assert ResultCategory.SAFE.value == 'safe'
          assert ResultCategory.FINDING.value == 'finding'
          assert ResultCategory.CRASH.value == 'crash'

          # Test 4: Report summarization
          report = FuzzReport(
              server_command='benchmark',
              tools_fuzzed=2,
              total_payloads=100,
              results=[],
          )
          assert report.tools_fuzzed == 2
          assert report.total_payloads == 100

          # Test 5: All 5 probe types exist
          from mcp_guard.payloads import (
              generate_shell_injection, generate_ssrf, generate_overflow,
              generate_type_confusion, generate_prompt_injection
          )
          assert generate_shell_injection(), 'shell-injection probes empty'
          assert generate_ssrf(), 'ssrf probes empty'
          assert generate_overflow(), 'overflow probes empty'
          assert generate_type_confusion(), 'type-confusion probes empty'
          assert generate_prompt_injection(), 'prompt-injection probes empty'

          print('Benchmark gate: PASS — methodology verified')
          "
      - name: SARIF output smoke test
        run: |
          python -c "
          from mcp_guard.report import FuzzReport
          from mcp_guard.fuzzer import FuzzResult, ResultCategory
          from mcp_guard.payloads import Payload, Severity

          results = [
              FuzzResult(
                  tool_name='test_tool',
                  probe_name='input',
                  payload_value='$(whoami)',
                  category=ResultCategory.FINDING,
                  rule_id='shell-injection',
                  severity='critical',
                  detail='Payload accepted',
                  response_preview='ok',
              ),
          ]
          report = FuzzReport(
              server_command='smoke',
              tools_fuzzed=1,
              total_payloads=1,
              results=results,
          )
          import io, json
          out = io.StringIO()
          report.to_sarif(out)
          sarif = json.loads(out.getvalue())
          assert sarif['version'] == '2.1.0'
          assert len(sarif['runs'][0]['results']) == 1
          print('SARIF smoke test: PASS')
          "
