name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install build tooling
        run: uv pip install build twine --system
      - name: Build package
        run: python -m build
      - name: Generate SBOM
        run: |
          cyclonedx-py environment --output-file sbom.json --format json
          cyclonedx-py environment --output-file sbom.xml --format xml
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: dist/*
      - name: Generate changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --oneline "${PREV_TAG}..HEAD" > /tmp/changelog.txt
          else
            git log --oneline > /tmp/changelog.txt
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: /tmp/changelog.txt
          files: |
            dist/*
            sbom.json
            sbom.xml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
